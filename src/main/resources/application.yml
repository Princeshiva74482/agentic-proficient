spring:
  application:
    name: urlshortner
  main:
    web-application-type: reactive
  r2dbc:
    url: r2dbc:h2:mem:///urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  flyway:
    enabled: true
    url: jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    user: sa
    password:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
  show-actuator: true
  packages-to-scan: com.agenticproficient.urlshortner
  paths-to-match:
    - /api/v1/**
    - /**

url-shortener:
  base-url: http://localhost:8080
  code-length: 8
  max-code-generation-attempts: 6
  default-ttl-days: 365
  privacy:
    ip-hash-salt: change-me-in-production
  security:
    allow-private-hosts: false
    allowed-schemes:
      - http
      - https
    reserved-aliases:
      - api
      - actuator
      - health
      - docs
      - swagger-ui
      - h2-console
      - favicon.ico

agentic:
  workflow:
    max-retries: 2
    step-timeout: 3s
    parallelism: 4
